name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: hook responds to a real payload
        run: |
          echo '{"tool_name":"Bash","tool_input":{"command":"git status"}}' \
            | TERM_PROGRAM=iTerm.app node src/hook.js \
            | grep -q '"permissionDecision":"allow"'
      - name: CLI starts
        run: node bin/cli.js --help
